# Longueur maximale d'une ligne avant que le formateur la coupe
line-length = 88
# Version de Python visée (influence les règles de modernisation)
target-version = "py312"
# Ne pas analyser les paquets installés dans l'environnement virtuel
extend-exclude = [".venv"]

[lint]
# Familles de règles activées :
#   E/F = erreurs de style et erreurs Python (variable inutilisée...)
#   I   = imports triés
#   UP  = syntaxe Python moderne
#   B   = pièges courants (bugbear)
select = ["E", "F", "I", "UP", "B"]
